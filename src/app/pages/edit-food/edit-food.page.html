<ion-header>
  <ion-toolbar>
    <ion-title>Edit Food</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <div *ngIf="isLoading">
    <ion-spinner></ion-spinner>
    <p>Loading...</p>
  </div>
  <form *ngIf="!isLoading" [formGroup]="foodForm" (ngSubmit)="saveFood()">
    <ion-list>
      <ion-item>
        <ion-label position="stacked">Name</ion-label>
        <ion-input formControlName="name" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Description</ion-label>
        <ion-textarea formControlName="description"></ion-textarea>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Price</ion-label>
        <ion-input type="number" formControlName="price" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Category</ion-label>
        <ion-input formControlName="category"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Image URL</ion-label>
        <ion-input formControlName="image"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label>Available</ion-label>
        <ion-toggle formControlName="available"></ion-toggle>
      </ion-item>
    </ion-list>
    <ion-button expand="block" type="submit" [disabled]="foodForm.invalid">Save</ion-button>
  </form>
</ion-content>
