<ion-header>
  <ion-toolbar>
     <ion-buttons slot="start">
      <ion-back-button color="light"></ion-back-button>
    </ion-buttons>
    <ion-title>Edit Food</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <div *ngIf="isLoading">
    <ion-spinner></ion-spinner>
    <p>Loading...</p>
  </div>
  <form *ngIf="!isLoading" [formGroup]="foodForm" (ngSubmit)="saveFood()">
    <ion-list>
      <ion-item class="custom-input">
        <ion-input 
          formControlName="name" 
          label="Name" 
          label-placement="floating" 
          fill="solid" 
          required>
        </ion-input>
      </ion-item>
      <ion-item class="custom-input">
        <ion-textarea 
          formControlName="description" 
          label="Description" 
          label-placement="floating" 
          fill="solid">
        </ion-textarea>
      </ion-item>
      <ion-item class="custom-input">
        <ion-input 
          type="number" 
          formControlName="price" 
          label="Price" 
          label-placement="floating" 
          fill="solid" 
          required>
        </ion-input>
      </ion-item>
      <ion-item class="custom-input">
        <ion-input 
          formControlName="category" 
          label="Category" 
          label-placement="floating" 
          fill="solid">
        </ion-input>
      </ion-item>
      <ion-item class="custom-input">
        <ion-input 
          formControlName="image" 
          label="Image URL" 
          label-placement="floating" 
          fill="solid">
        </ion-input>
      </ion-item>
      <ion-item>
        <ion-label>Available</ion-label>
        <ion-toggle formControlName="available"></ion-toggle>
      </ion-item>
    </ion-list>
    <ion-button expand="block" type="submit" [disabled]="foodForm.invalid">Save</ion-button>
  </form>
</ion-content>
