<ion-header>
  <ion-toolbar>
    <ion-title>Add Restaurant</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <div class="swiggy-add-restaurant-card">
    <div class="swiggy-add-restaurant-header">
      <ion-icon name="storefront-outline" size="large"></ion-icon>
      <h1>Add Your Restaurant</h1>
      <p>Enter your restaurant details to get started</p>
    </div>
    <form [formGroup]="restaurantForm">
      <ion-item class="custom-input">
        <ion-input 
          formControlName="name" 
          label="Name" 
          label-placement="floating" 
          fill="solid" 
          placeholder="Restaurant name">
        </ion-input>
      </ion-item>
      <ion-item class="custom-input">
        <ion-input 
          formControlName="address" 
          label="Address" 
          label-placement="floating" 
          fill="solid" 
          placeholder="Restaurant address">
        </ion-input>
      </ion-item>
      <ion-item class="custom-input">
        <ion-input 
          formControlName="cuisine" 
          label="Cuisine" 
          label-placement="floating" 
          fill="solid" 
          placeholder="Cuisine type">
        </ion-input>
      </ion-item>
      <ion-item class="custom-input">
        <ion-textarea 
          formControlName="description" 
          label="Description" 
          label-placement="floating" 
          fill="solid" 
          placeholder="Describe your restaurant">
        </ion-textarea>
      </ion-item>
      <ion-item class="custom-input">
        <ion-input 
          formControlName="deliveryTime" 
          label="Delivery Time" 
          label-placement="floating" 
          fill="solid" 
          placeholder="e.g., 25-35 min">
        </ion-input>
      </ion-item>
      <ion-item class="custom-input">
        <ion-input 
          formControlName="minOrder" 
          type="number" 
          label="Min Order" 
          label-placement="floating" 
          fill="solid" 
          placeholder="Minimum order amount">
        </ion-input>
      </ion-item>
      <ion-item style="display:none;">
        <ion-input 
          formControlName="latitude" 
          label="Latitude" 
          label-placement="floating" 
          readonly>
        </ion-input>
      </ion-item>
      <ion-item style="display:none;">
        <ion-input 
          formControlName="longitude" 
          label="Longitude" 
          label-placement="floating" 
          readonly>
        </ion-input>
      </ion-item>
      <ion-button expand="block" (click)="addRestaurant()">Add Restaurant</ion-button>
    </form>
  </div>
</ion-content>
