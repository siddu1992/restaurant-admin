<ion-content [fullscreen]="true" class="login-content">
  <div class="login-shell">
    <div class="brand-panel">
      <div class="brand-mark">KH</div>
      <h1 class="brand-name">KitchenHub</h1>
      <p class="brand-tagline">Manage menus, orders, and delivery from one place</p>
    </div>

    <div class="form-panel" *ngIf="!isLoading">
      <form [formGroup]="loginForm" (ngSubmit)="login()" class="auth-form">
        <h2>Welcome back</h2>
        <p class="sub">Sign in with your restaurant owner account</p>

        <div class="field">
          <label>Email</label>
          <ion-input
            formControlName="email"
            type="email"
            placeholder="owner@restaurant.com"
            [class.error]="isFieldInvalid('email')">
          </ion-input>
          <div *ngIf="isFieldInvalid('email')" class="error-message">{{ getFieldError('email') }}</div>
        </div>

        <div class="field">
          <label>Password</label>
          <ion-input
            formControlName="password"
            type="password"
            placeholder="Enter password"
            [class.error]="isFieldInvalid('password')">
          </ion-input>
          <div *ngIf="isFieldInvalid('password')" class="error-message">{{ getFieldError('password') }}</div>
        </div>

        <ion-button
          type="submit"
          expand="block"
          class="primary-btn"
          [disabled]="loginForm.invalid || isLoggingIn">
          <ion-spinner *ngIf="isLoggingIn" name="crescent"></ion-spinner>
          <span *ngIf="!isLoggingIn">Sign In</span>
        </ion-button>

        <div class="divider"><span>or</span></div>

        <ion-button
          expand="block"
          fill="outline"
          class="google-btn"
          (click)="googleLogin()"
          [disabled]="isGoogleLoggingIn">
          <ion-spinner *ngIf="isGoogleLoggingIn" name="crescent"></ion-spinner>
          <span *ngIf="!isGoogleLoggingIn">
            <ion-icon name="logo-google"></ion-icon>
            Continue with Google
          </span>
        </ion-button>

        <p class="signup-text">
          New restaurant?
          <button type="button" class="link-btn" (click)="goToSignup()">Create account</button>
        </p>
      </form>
    </div>

    <div *ngIf="isLoading" class="loading-wrap">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Signing you in…</p>
    </div>
  </div>
</ion-content>
