<ion-header class="ion-no-border">
  <ion-toolbar class="login-header">
    <ion-title class="login-title">
      <ion-icon name="restaurant" class="title-icon"></ion-icon>
      Restaurant Admin
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="login-content">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-container">
    <ion-spinner name="crescent" class="loading-spinner"></ion-spinner>
    <p class="loading-text">Logging you in...</p>
  </div>

  <!-- Main Login Content -->
  <div *ngIf="!isLoading" class="login-main">
    <!-- Welcome Section -->
    <div class="welcome-section">
      <div class="welcome-icon">
        <ion-icon name="restaurant" class="welcome-icon-svg"></ion-icon>
      </div>
      <h1 class="welcome-title">Welcome Back</h1>
      <p class="welcome-subtitle">Sign in to manage your restaurant</p>
    </div>

    <!-- Login Form -->
    <div class="login-form-section">
      <ion-card class="login-form-card">
        <ion-card-content>
          <form [formGroup]="loginForm" (ngSubmit)="login()" class="login-form">
            
            <!-- Email Field -->
            <ion-item class="form-item">
              <ion-input 
                label="Email Address"
                labelPlacement="stacked"
                formControlName="email" 
                type="email" 
                placeholder="Enter your email address"
                [clearOnEdit]="true"
                [class.error]="isFieldInvalid('email')">
              </ion-input>
              <div *ngIf="isFieldInvalid('email')" class="error-message">
                <ion-icon name="alert-circle"></ion-icon>
                {{ getFieldError('email') }}
              </div>
            </ion-item>

            <!-- Password Field -->
            <ion-item class="form-item">
              <ion-input 
                label="Password"
                labelPlacement="stacked"
                formControlName="password" 
                type="password" 
                placeholder="Enter your password"
                [clearOnEdit]="true"
                [class.error]="isFieldInvalid('password')">
              </ion-input>
              <div *ngIf="isFieldInvalid('password')" class="error-message">
                <ion-icon name="alert-circle"></ion-icon>
                {{ getFieldError('password') }}
              </div>
            </ion-item>

            <!-- Login Button -->
            <ion-button 
              type="submit" 
              expand="block" 
              class="login-button"
              [disabled]="loginForm.invalid || isLoggingIn">
              <ion-spinner *ngIf="isLoggingIn" name="crescent" class="button-spinner"></ion-spinner>
              <span *ngIf="!isLoggingIn">
                <ion-icon name="log-in" slot="start"></ion-icon>
                Sign In
              </span>
            </ion-button>
          </form>

          <!-- Divider -->
          <div class="divider">
            <span class="divider-text">or</span>
          </div>

          <!-- Google Login Button -->
          <ion-button 
            expand="block" 
            fill="outline" 
            class="google-login-button"
            (click)="googleLogin()"
            [disabled]="isGoogleLoggingIn">
            <ion-spinner *ngIf="isGoogleLoggingIn" name="crescent" class="button-spinner"></ion-spinner>
            <span *ngIf="!isGoogleLoggingIn">
              <ion-icon name="logo-google" slot="start"></ion-icon>
              Continue with Google
            </span>
          </ion-button>
        </ion-card-content>
      </ion-card>
    </div>

    <!-- Sign Up Link -->
    <div class="signup-section">
      <p class="signup-text">
        Don't have an account? 
        <ion-button fill="clear" class="signup-link" (click)="goToSignup()">
          Sign Up
        </ion-button>
      </p>
    </div>
  </div>
</ion-content>
