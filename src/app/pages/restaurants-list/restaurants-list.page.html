<ion-header>
  <ion-toolbar>
    <ion-title>All Restaurants</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <div *ngIf="isLoading">
    <ion-spinner></ion-spinner>
    <p>Loading...</p>
  </div>
  <div *ngIf="!isLoading && restaurants && restaurants.length">
    <ion-card *ngFor="let restaurant of restaurants" class="restaurant-card">
      <!-- Existing restaurant display code -->
      <ion-card-header>
        <ion-card-title>{{ restaurant.name }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>{{ restaurant.address }}</p>
        <p>{{ restaurant.cuisine }}</p>
        <ion-button color="primary" size="small" (click)="editRestaurant(restaurant)">
          <ion-icon name="create-outline"></ion-icon> Edit
        </ion-button>
        <ion-button color="secondary" size="small" (click)="goToDashboard(restaurant)">
          <ion-icon name="analytics-outline"></ion-icon> Dashboard
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
  <div *ngIf="!isLoading && !restaurants.length">
    <p>No restaurants found.</p>
  </div>
</ion-content>
