<ion-header>
  <ion-toolbar>
    <ion-title>Add Food Item</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <form [formGroup]="foodForm" (ngSubmit)="addFood()" class="swiggy-form">
    <ion-item>
      <ion-label position="floating">Name</ion-label>
      <ion-input formControlName="name" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Description</ion-label>
      <ion-textarea formControlName="description" required></ion-textarea>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Price (₹)</ion-label>
      <ion-input type="number" formControlName="price" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Image URL</ion-label>
      <ion-input formControlName="image"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Category</ion-label>
      <ion-select formControlName="category" required>
        <ion-select-option value="South Indian">South Indian</ion-select-option>
        <ion-select-option value="North Indian">North Indian</ion-select-option>
        <ion-select-option value="Chinese">Chinese</ion-select-option>
        <ion-select-option value="Snacks">Snacks</ion-select-option>
        <ion-select-option value="Dessert">Dessert</ion-select-option>
        <!-- Add more as needed -->
      </ion-select>
    </ion-item>
    <ion-item lines="none">
      <ion-label>Available</ion-label>
      <ion-toggle formControlName="available"></ion-toggle>
    </ion-item>
    <div class="form-actions">
      <ion-button expand="block" type="submit" [disabled]="foodForm.invalid || isLoading">
        <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
        <span *ngIf="!isLoading">Add Food</span>
      </ion-button>
    </div>
  </form>
</ion-content>
