<div class="admin-form-page">
  <div class="page-toolbar">
    <div>
      <p class="eyebrow">Menu</p>
      <h2>Add menu item</h2>
      <p class="subtitle">Create a new dish for the selected restaurant</p>
    </div>
    <button type="button" class="ghost-btn" (click)="goBack()">
      <ion-icon name="arrow-back-outline"></ion-icon>
      Back
    </button>
  </div>

  <div class="state-card error" *ngIf="!hasRestaurant">
    <ion-icon name="alert-circle-outline"></ion-icon>
    <p>Select a restaurant before adding menu items.</p>
    <a routerLink="/restaurants" class="primary-btn">Choose restaurant</a>
  </div>

  <form class="form-card" *ngIf="hasRestaurant" [formGroup]="foodForm" (ngSubmit)="submit()">
    <section class="form-section">
      <h3>
        <ion-icon name="image-outline"></ion-icon>
        Item photo
      </h3>

      <div class="image-panel">
        <button type="button" class="image-preview" (click)="triggerFileInput()">
          <img *ngIf="previewImage" [src]="previewImage" alt="Menu item preview" />
          <div class="upload-placeholder" *ngIf="!previewImage">
            <ion-icon name="camera-outline"></ion-icon>
            <strong>Upload photo</strong>
            <span>JPG or PNG up to 5MB</span>
          </div>
        </button>
        <div class="image-actions">
          <button type="button" class="ghost-btn" (click)="triggerFileInput()">
            <ion-icon name="camera-outline"></ion-icon>
            {{ previewImage ? 'Change photo' : 'Choose photo' }}
          </button>
          <button type="button" class="ghost-btn" *ngIf="previewImage" (click)="clearImage()">
            Remove
          </button>
        </div>
        <input
          #fileInput
          type="file"
          accept="image/*"
          (change)="onImageSelected($event)"
          hidden />
      </div>

      <label>
        <span>Or paste image URL</span>
        <input formControlName="image" type="url" placeholder="https://…" (input)="imagePreview = null" />
      </label>
    </section>

    <section class="form-section">
      <h3>
        <ion-icon name="restaurant-outline"></ion-icon>
        Item details
      </h3>

      <div class="grid-2">
        <label [class.invalid]="isInvalid('name')">
          <span>Name *</span>
          <input formControlName="name" type="text" placeholder="e.g. Butter Chicken" />
          <small *ngIf="isInvalid('name')">{{ fieldError('name') }}</small>
        </label>
        <label [class.invalid]="isInvalid('category')">
          <span>Category *</span>
          <select formControlName="category">
            <option value="" disabled>Select category</option>
            <option *ngFor="let category of categories" [value]="category.value">
              {{ category.label }}
            </option>
          </select>
          <small *ngIf="isInvalid('category')">{{ fieldError('category') }}</small>
        </label>
      </div>

      <label [class.invalid]="isInvalid('description')">
        <span>Description</span>
        <textarea
          formControlName="description"
          rows="3"
          placeholder="Short description customers will see"></textarea>
        <small *ngIf="isInvalid('description')">{{ fieldError('description') }}</small>
      </label>

      <div class="grid-2">
        <label [class.invalid]="isInvalid('price')">
          <span>Price (₹) *</span>
          <input formControlName="price" type="number" min="1" step="1" placeholder="199" />
          <small *ngIf="isInvalid('price')">{{ fieldError('price') }}</small>
        </label>
        <label class="toggle-row">
          <div>
            <strong>Available</strong>
            <p>Show this item on the customer menu</p>
          </div>
          <input type="checkbox" formControlName="available" class="toggle-input" />
        </label>
      </div>
    </section>

    <div class="form-actions">
      <button type="button" class="ghost-btn" (click)="goBack()">Cancel</button>
      <button type="submit" class="primary-btn" [disabled]="isLoading">
        <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
        <ion-icon *ngIf="!isLoading" name="checkmark-circle-outline"></ion-icon>
        {{ isLoading ? 'Saving…' : 'Add to menu' }}
      </button>
    </div>
  </form>
</div>
