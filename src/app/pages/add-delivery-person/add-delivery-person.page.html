<div class="admin-form-page">
  <div class="page-toolbar">
    <div>
      <p class="eyebrow">Staff</p>
      <h2>Add delivery person</h2>
      <p class="subtitle">Register a rider account for your delivery team</p>
    </div>
    <a routerLink="/dashboard" class="ghost-btn">
      <ion-icon name="arrow-back-outline"></ion-icon>
      Back
    </a>
  </div>

  <div class="success-card" *ngIf="registrationSuccess; else formBlock">
    <ion-icon name="checkmark-circle-outline"></ion-icon>
    <h3>Registration successful</h3>
    <p>The delivery person can now sign in with the email and password you set.</p>
    <div class="form-actions">
      <button type="button" class="ghost-btn" (click)="goBack()">Back to dashboard</button>
      <button type="button" class="primary-btn" (click)="addAnother()">
        <ion-icon name="person-add-outline"></ion-icon>
        Add another
      </button>
    </div>
  </div>

  <ng-template #formBlock>
    <form class="form-card" [formGroup]="deliveryForm" (ngSubmit)="registerDeliveryPerson()">
      <section class="form-section">
        <h3>
          <ion-icon name="person-add-outline"></ion-icon>
          Basic information
        </h3>
        <div class="grid-2">
          <label [class.invalid]="isInvalid('name')">
            <span>Full name *</span>
            <input formControlName="name" type="text" placeholder="Rider full name" />
            <small *ngIf="isInvalid('name')">{{ fieldError('name') }}</small>
          </label>
          <label [class.invalid]="isInvalid('phone')">
            <span>Phone *</span>
            <input formControlName="phone" type="tel" maxlength="10" placeholder="10-digit mobile" />
            <small *ngIf="isInvalid('phone')">{{ fieldError('phone') }}</small>
          </label>
        </div>
      </section>

      <section class="form-section">
        <h3>
          <ion-icon name="bicycle-outline"></ion-icon>
          Account access
        </h3>
        <div class="grid-2">
          <label [class.invalid]="isInvalid('email')">
            <span>Email *</span>
            <input formControlName="email" type="email" placeholder="rider@email.com" />
            <small *ngIf="isInvalid('email')">{{ fieldError('email') }}</small>
          </label>
          <label [class.invalid]="isInvalid('password')">
            <span>Password *</span>
            <input formControlName="password" type="password" placeholder="Min 6 characters" />
            <small *ngIf="isInvalid('password')">{{ fieldError('password') }}</small>
          </label>
        </div>
      </section>

      <section class="form-section">
        <h3>
          <ion-icon name="bicycle-outline"></ion-icon>
          Vehicle & area
        </h3>
        <div class="grid-3">
          <label>
            <span>Vehicle type</span>
            <select formControlName="vehicleType">
              <option *ngFor="let type of vehicleTypes" [value]="type.value">
                {{ type.label }}
              </option>
            </select>
          </label>
          <label>
            <span>Vehicle number</span>
            <input formControlName="vehicleNumber" type="text" placeholder="Optional" />
          </label>
          <label [class.invalid]="isInvalid('pincode')">
            <span>Pincode *</span>
            <input formControlName="pincode" type="text" maxlength="6" placeholder="500001" />
            <small *ngIf="isInvalid('pincode')">{{ fieldError('pincode') }}</small>
          </label>
        </div>
        <label>
          <span>Address</span>
          <textarea formControlName="address" rows="3" placeholder="Optional home/base address"></textarea>
        </label>
      </section>

      <div class="form-actions">
        <button type="button" class="ghost-btn" (click)="goBack()">Cancel</button>
        <button type="submit" class="primary-btn" [disabled]="isRegistering">
          {{ isRegistering ? 'Registering…' : 'Register delivery person' }}
        </button>
      </div>
    </form>
  </ng-template>
</div>
