<ion-header>
  <ion-toolbar>
    <ion-title>Food Management</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <div *ngIf="isLoading">
    <ion-spinner></ion-spinner>
    <p>Loading...</p>
  </div>
  <div *ngIf="!isLoading && foods.length">
    <ion-list>
      <ion-item *ngFor="let food of foods">
        <ion-label>
          <h2>{{ food.name }}</h2>
          <p>{{ food.description }}</p>
          <p>₹{{ food.price }}</p>
        </ion-label>
      </ion-item>
    </ion-list>
  </div>
  <div *ngIf="!isLoading && !foods.length">
    <p>No food items found.</p>
  </div>
</ion-content>
